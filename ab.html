<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir conta</title>
</head>
<body>

    <style>
         :root{
            --cor0:#ffff;
            --cor1:#D9D9D9;
            --cor2:#8C8C8C;
            --cor3:#DB981A;
            --cor4:#262626;
            --cor5:#0D0D0D;
          }



        body{
            
            background-image: linear-gradient(to left, var(--cor5),var(--cor4) );

            padding-top: 100px;
        }
        h1{
            color:var(--cor3);
            text-align: center;
            margin-bottom: 100px;
        }
        h3{
            color: var(--cor2);
            text-align: center;
            margin-bottom: 10px;
        }
        input{
            display: block;
            margin:auto;
            height: 20px;
            width: 300px;
            margin-bottom: 20px;
        }
        button{
            display: block;
            margin: auto;
            height: 30px;
            width: 80px;
        }
        a{
            text-decoration: none;
            color: var(--cor5);
        }

    </style>
</head>
<body>
    <h1>Crie sua conta</h1>

    <form>
        <h3>Nome completo</h3>
        <input type="text" placeholder="Informe seu nome">

        <h3>Email</h3>
        <input type="email" placeholder="informe seu e-mail">

        <h3>Data de nacimento</h3>
        <input type="date" placeholder="__/__/___">

        <h3>Celular</h3>
        <input type="tel" placeholder="(00)00000-00000">

        <h3>Senha</h3>
        <input type="password" placeholder="Senha">
        <br>
        <button type="reset">Entrar</button>
        <br>
         <button><a href="inv.html">Voltar</a></button>
    </form>
    
</body>
</html>
    
</body>
</html>
